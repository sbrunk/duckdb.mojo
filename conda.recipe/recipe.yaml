context:
  version: "0.1.0"

package:
  name: duckdb-mojo
  version: ${{ version }}

source:
  # modular-community requires a full 40-char commit SHA (not a branch/tag) so
  # the build is reproducible. Bump this to the release commit before each PR to
  # modular-community, and keep `context.version` / `build.number` in sync.
  - git: https://github.com/sbrunk/duckdb.mojo.git
    rev: "de5eb4bc1f392d9793aaac0d12411d02eb70d01b"

build:
  number: 0
  script:
    # Precompile the `duckdb` package into $PREFIX/lib/mojo/. The Mojo compiler
    # only searches the paths in MODULAR_MOJO_MAX_IMPORT_PATH (pixi sets it on
    # activation, a conda build does not). Point it at the host prefix so
    # precompile finds emberserde.mojoc.
    - MODULAR_MOJO_MAX_IMPORT_PATH="${{ PREFIX }}/lib/mojo" mojo precompile duckdb -o ${{ PREFIX }}/lib/mojo/duckdb.mojoc

requirements:
  build:
    # Pinned to the compiler in pixi.toml. .mojoc artifacts are compiler-version
    # specific, so this must match the version used to build the package.
    - mojo-compiler ==1.2.0
  host:
    - mojo-compiler ==1.2.0
    - emberserde ==0.2.0
  run:
    # Exact pin, not pin_compatible: a precompiled .mojoc only loads under the
    # exact compiler it was built with. pin_compatible would let a newer
    # release satisfy the install and fail with a version-mismatch error at
    # import time.
    - mojo-compiler ==1.2.0
    # The bindings dlopen libduckdb at runtime, so the shared library must be
    # present. Exact pin: every function of DuckDB's V2 C API is still
    # unstable, so the bindings only work with the DuckDB version they were
    # generated against (checked when the bindings are first used).
    - libduckdb ==2.0.0
    # Needed when compiling code that uses the package: the type mapping is
    # generic code built on emberserde. emberserde 0.2.0 is not published on a
    # channel yet: the conda-recipe CI job builds it from the pinned git commit
    # and passes it as a local channel. Publishing it to modular-community
    # retires that workaround.
    - emberserde ==0.2.0

tests:
  - script:
      - if: unix
        then:
          - mojo run smoke_test.mojo
    files:
      recipe:
        - smoke_test.mojo
    requirements:
      run:
        - libduckdb ==2.0.0

about:
  homepage: https://github.com/sbrunk/duckdb.mojo
  repository: https://github.com/sbrunk/duckdb.mojo
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/sbrunk/duckdb.mojo#readme
  summary: "DuckDB for Mojo: queries, UDFs, extensions and portable GPU compute."
  description: |
    duckdb.mojo lets Mojo programs use DuckDB. Run SQL and decode results into
    Mojo types, including structs, lists and maps. Build queries with a lazy
    relation API and load data with the Appender. Register scalar, aggregate and
    table functions written in Mojo, including SIMD-vectorized ones, and build
    DuckDB extensions in Mojo that load with LOAD. The package also ships SIMD
    math kernels (duckdb.kernels) that can be registered as SQL functions.
    Mojo GPU kernels can process DuckDB data directly. The same kernel code runs
    on NVIDIA, AMD and Apple silicon GPUs (Metal), with no CUDA toolkit or
    vendor-specific code. GPU kernels need the max-core package, which
    duckdb-mojo does not depend on.

extra:
  maintainers:
    - sbrunk
