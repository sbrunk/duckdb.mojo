context:
  version: "0.1.0"

package:
  name: duckdb-mojo
  version: ${{ version }}

source:
  # Local build test only: build from the working tree instead of a pushed git
  # SHA. The committed recipe.yaml uses `git:` + a full SHA for reproducibility.
  - path: ..
    use_gitignore: true

build:
  number: 0
  script:
    # The Mojo compiler only searches the paths in MODULAR_MOJO_MAX_IMPORT_PATH
    # (pixi sets it on activation, a conda build does not). Point it at the host
    # prefix so precompile finds emberserde.mojoc.
    - MODULAR_MOJO_MAX_IMPORT_PATH="${{ PREFIX }}/lib/mojo" mojo precompile duckdb -o ${{ PREFIX }}/lib/mojo/duckdb.mojoc

requirements:
  build:
    - mojo-compiler ==1.2.0
  host:
    - mojo-compiler ==1.2.0
    - emberserde ==0.2.0
  run:
    # Exact pin, not pin_compatible: a precompiled .mojoc only loads under the
    # exact compiler it was built with. pin_compatible would allow a newer
    # release at install time, which fails with a version-mismatch error.
    - mojo-compiler ==1.2.0
    # Exact pin: every function of DuckDB's V2 C API is still unstable.
    - libduckdb ==2.0.0
    # Generic code built on emberserde is compiled in user code. emberserde
    # 0.2.0 is not published on a channel yet: the conda-recipe CI job builds
    # it from the pinned git commit and passes it as a local channel.
    - emberserde ==0.2.0

tests:
  - script:
      - if: unix
        then:
          - mojo run smoke_test.mojo
    files:
      recipe:
        - smoke_test.mojo
    requirements:
      run:
        - libduckdb ==2.0.0

about:
  homepage: https://github.com/sbrunk/duckdb.mojo
  repository: https://github.com/sbrunk/duckdb.mojo
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/sbrunk/duckdb.mojo#readme
  summary: "DuckDB for Mojo: queries, UDFs, extensions and portable GPU compute."
  description: |
    duckdb.mojo lets Mojo programs use DuckDB. Run SQL and decode results into
    Mojo types, including structs, lists and maps. Build queries with a lazy
    relation API and load data with the Appender. Register scalar, aggregate and
    table functions written in Mojo, including SIMD-vectorized ones, and build
    DuckDB extensions in Mojo that load with LOAD. The package also ships SIMD
    math kernels (duckdb.kernels) that can be registered as SQL functions.
    Mojo GPU kernels can process DuckDB data directly. The same kernel code runs
    on NVIDIA, AMD and Apple silicon GPUs (Metal), with no CUDA toolkit or
    vendor-specific code. GPU kernels need the max-core package, which
    duckdb-mojo does not depend on.

extra:
  maintainers:
    - sbrunk
