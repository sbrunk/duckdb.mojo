[workspace]
authors = ["Sören Brunk <soeren@brunk.io>"]
channels = ["https://prefix.dev/conda-forge", "https://conda.modular.com/max-nightly/"]
description = "DuckDB bindings for Mojo"
name = "duckdb.mojo"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[package]
name = "duckdb.mojo"
version = "0.0.1"

# see https://prefix-dev.github.io/pixi-build-backends/backends/pixi-build-mojo/
[package.host-dependencies]
mojo-compiler = "=1.0.0b2.dev2026061203"

[package.build-dependencies]
mojo-compiler = "=1.0.0b2.dev2026061203"

[package.build.backend]
name = "pixi-build-mojo"
version = "0.1.*"
channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
]

[package.build.config.pkg]
name = "duckdb"
path = "duckdb"

[tasks]
build = "pixi run mojo precompile duckdb -o duckdb.mojoc"
test-library = { cmd = "bash scripts/run_tests.sh" }
clone-duckdb = "sh scripts/clone_duckdb.sh"
generate-api = { cmd = "python3 scripts/generate_mojo_api.py --duckdb-dir .duckdb-src --output duckdb/_libduckdb.mojo", depends-on = ["clone-duckdb"] }
# Fails if duckdb/_libduckdb.mojo is out of sync with the DuckDB version
# (regenerates first via generate-api, then checks for an unexpected diff).
check-generated-api = { cmd = "bash scripts/check_generated_api.sh", depends-on = ["generate-api"] }

# Demo extension.
# The mojo build/run calls are wrapped in `bash -c` so $MOJO_TARGET_FLAGS (set
# ONLY in CI, see .github/workflows/test.yml) is applied as a codegen target
# override on the affected runners. Unset locally → expands to nothing → native.
build-demo-extension = { cmd = "bash -c 'mkdir -p demo-extension/build && mojo build $MOJO_TARGET_FLAGS demo-extension/src/demo_mojo_extension.mojo --emit shared-lib -o demo-extension/build/demo_mojo.duckdb_extension && python3 scripts/append_extension_metadata.py demo-extension/build/demo_mojo.duckdb_extension'", depends-on = ["build"] }
test-demo-extension = { cmd = "duckdb -unsigned -c \"LOAD 'demo-extension/build/demo_mojo.duckdb_extension'; SELECT mojo_add_numbers(40, 2) AS result;\"", depends-on = ["build-demo-extension"] }

# Test extension
build-test-extension = { cmd = "bash -c 'mkdir -p test-extension/build && mojo build $MOJO_TARGET_FLAGS test-extension/src/test_mojo_extension.mojo --emit shared-lib -o test-extension/build/mojo.duckdb_extension && python3 scripts/append_extension_metadata.py test-extension/build/mojo.duckdb_extension && mojo build $MOJO_TARGET_FLAGS test-extension/src/test_bad_api_extension.mojo --emit shared-lib -o test-extension/build/bad_api.duckdb_extension && python3 scripts/append_extension_metadata.py test-extension/build/bad_api.duckdb_extension && mojo build $MOJO_TARGET_FLAGS test-extension/src/test_mojo_unstable_extension.mojo --emit shared-lib -o test-extension/build/mojo_unstable.duckdb_extension && python3 scripts/append_extension_metadata.py test-extension/build/mojo_unstable.duckdb_extension --abi-type C_STRUCT_UNSTABLE'", depends-on = ["build"] }
test-extension = { cmd = "bash -c 'mojo run $MOJO_TARGET_FLAGS test-extension/test_extension.mojo'", depends-on = ["build-test-extension"] }

test = {depends-on = ["test-library", "test-demo-extension", "test-extension"]}

# Mojo kernel overrides (packages/mojo-kernel-overrides): a DuckDB extension that
# rewrites built-in scalar/aggregate functions to Mojo SIMD kernels at load time,
# with NO patch to DuckDB. Builds against the default env's libduckdb headers/lib.
overrides-build = "bash packages/mojo-kernel-overrides/build.sh"
# Build + load the extension and print a stock-vs-Mojo benchmark table.
# Pass driver args after `--`, e.g.: pixi run overrides-bench -- --threads=1 --rows=20000000
overrides-bench = "bash packages/mojo-kernel-overrides/run-benchmark.sh"
overrides-clean = "rm -rf packages/mojo-kernel-overrides/build"
# Run the overrides through DuckDB's own benchmark suite (https://duckdb.org/docs/current/dev/benchmark).
# `overrides-bench-runner-build` builds the extension + a stock benchmark_runner with a one-line
# "LOAD an extension at init" hook (reuses .duckdb-src); `overrides-bench-runner` runs the suite
# stock-vs-overrides and prints a speedup table. Pass a benchmark regex + runner args, e.g.:
#   pixi run overrides-bench-runner 'benchmark/micro/mojo_simd/.*' --threads=1
#   pixi run overrides-bench-runner 'benchmark/tpch/sf1/.*'   # TPC-H Q1-Q22
overrides-bench-runner-build = { cmd = "bash packages/mojo-kernel-overrides/benchmark/build_runner.sh", depends-on = ["overrides-build", "clone-duckdb"] }
overrides-bench-runner = "bash packages/mojo-kernel-overrides/benchmark/run_runner_compare.sh"

# mojo-gpu-operator: transparent GPU offload (array_cosine_distance + TPC-H Q1/Q3/Q5/Q6/Q14)
# via an optimizer extension, with Mojo GPU kernels. See packages/mojo-gpu-operator/README.md.
gpu-op-build = "bash packages/mojo-gpu-operator/build.sh"
gpu-op-clean = "rm -rf packages/mojo-gpu-operator/build"
# Phase-0 de-risking probes: 0a (does a scanned column flow through DBConfig.allocator?),
# 0b (is a DB-wide unified allocator viable, or must we pin?).
gpu-op-probe-alloc = "clang++ -std=c++17 -O2 packages/mojo-gpu-operator/bench/alloc_probe.cpp -I $CONDA_PREFIX/include -L $CONDA_PREFIX/lib -lduckdb -Wl,-rpath,$CONDA_PREFIX/lib -o packages/mojo-gpu-operator/build/alloc_probe && packages/mojo-gpu-operator/build/alloc_probe"
gpu-op-probe-route = "mojo run packages/mojo-gpu-operator/bench/apple_alloc_route_probe.mojo"
# Phase 2: quantify the pin-resident win (GPU pinned vs re-upload vs CPU SIMD, K sweep).
gpu-op-bench = "mojo run packages/mojo-gpu-operator/bench/pin_resident_bench.mojo"
# TPC-H Q6: de-risk the exact-decimal filter+sum GPU kernel (bit-exact vs CPU int128).
gpu-op-q6test = "mojo run packages/mojo-gpu-operator/bench/q6_kernel_test.mojo"
# TPC-H Q1: de-risk the exact-decimal grouped-aggregation GPU kernel (bit-exact vs CPU int128).
gpu-op-q1test = "mojo run packages/mojo-gpu-operator/bench/q1_kernel_test.mojo"
# TPC-H Q14: de-risk the GPU hash-probe join kernel (bit-exact vs CPU int128, zero misses).
gpu-op-q14test = "mojo run packages/mojo-gpu-operator/bench/q14_kernel_test.mojo"
# TPC-H Q3: de-risk the GPU multi-way-join + per-order atomic accumulation (bit-exact vs CPU).
gpu-op-q3test = "mojo run packages/mojo-gpu-operator/bench/q3_kernel_test.mojo"
# TPC-H Q3: de-risk the GPU segmented-reduction group-by (one warp per order segment, bit-exact vs CPU int128).
gpu-op-q3groupby = "mojo run packages/mojo-gpu-operator/bench/q3_groupby_test.mojo"
# TPC-H Q5: de-risk the GPU 6-table-join grouped aggregation (correlated condition, per-block-partials, bit-exact vs CPU).
gpu-op-q5test = "mojo run packages/mojo-gpu-operator/bench/q5_kernel_test.mojo"
# GPU-direct native-storage decode (Phase B): bit-exact synthetic test of the portable
# Mojo BITPACKING (CONSTANT/FOR) + UNCOMPRESSED decoders vs the original host arrays.
gpu-op-native-decode-test = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/native_decode_test.mojo"
# Bounded-LRU pin-cache eviction test (feature #4): pin > budget, assert eviction
# via gpu_pin_status, then assert an evicted kNN query cold-rebuilds correctly.
gpu-op-pin-evict-test = "bash packages/mojo-gpu-operator/bench/pin_evict_test.sh"
# Phase 2 cost-aware placement A/B: drives one pool state through both eviction
# pickers (keep-benefit vs LRU pick opposite victims) + promotion. Needs a GPU.
gpu-op-costaware-test = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/colpool_costaware_test.mojo"
# Stage-2 shuttle tests: drive the FULL descriptor C-ABI (build->materialize->feed
# ->finalize) bit-exact vs a CPU int128 reference. Q14 adds the FK-join dim path.
gpu-op-q6shuttle = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/q6_shuttle_test.mojo"
# NR3 (GPU_OP_FILTER_OR): ungrouped sum(x) WHERE a=2 OR a=9 OR a=40 over one fact
# table -> the OR-of-equalities PASS-PROGRAM, AND-composed into the host pass column.
gpu-op-orfilter-test = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/or_filter_shuttle_test.mojo"
# GPU_OP_NULLABLE: live-SQL end-to-end test of the nullable-column SUM slice (set
# GPU_OP_NULLABLE=1 to exercise the routed path; unset -> nullable declines to stock).
gpu-op-nullable-test = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/nullable_sql_test.mojo"
# GPU_OP_NULLABLE on the f64 path: transcendental SUM + statistical aggregates over
# nullable DECIMAL columns vs stock (NVIDIA-only win; declines->stock on Apple/AMD).
gpu-op-nullable-f64-test = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/nullable_f64_sql_test.mojo"
# DENSE grouped + selective-filter phantom-group regression (operator row count == stock).
gpu-op-dense-phantom-test = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/q1_dense_filter_phantom_probe.mojo"
gpu-op-q14shuttle = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/q14_shuttle_test.mojo"
gpu-op-q3shuttle = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/q3_shuttle_test.mojo"
gpu-op-q5shuttle = "mojo run -I packages/mojo-gpu-operator/src packages/mojo-gpu-operator/bench/q5_shuttle_test.mojo"
# Warm A/B (stock vs operator) of the GPU f64 win classes DuckDB does not accelerate:
# transcendental (sum/avg of sqrt/exp/ln/log10/log2/power) + statistical (stddev/var/covar/
# corr/regr_*) aggregates, ungrouped + dense-grouped. Self-generating DECIMAL data (no tpch
# dep). Prereq: `gpu-op-build` + `overrides-bench-runner-build` (reuses that runner). NVIDIA-only
# wins (declines ~1.0x on Apple/AMD). See packages/mojo-gpu-operator/benchmark/run_gpu_op_bench.sh.
gpu-op-bench-runner = "bash packages/mojo-gpu-operator/benchmark/run_gpu_op_bench.sh"

# Compile-check (no run) the benchmarks so they can't silently rot when the
# stdlib or duckdb API drifts. The op-replacement benchmark needs the `full`
# environment and is excluded here (see scripts/compile_check.sh).
compile-benchmarks = { cmd = "bash scripts/compile_check.sh benchmark" }

# for local development
[dependencies]
libduckdb-devel = "=1.5.3"
duckdb-cli = "=1.5.3"
mojo = "=1.0.0b2.dev2026061203"
#mojodoc = { git = "https://github.com/ehsanmok/mojodoc.git", branch = "main" }

# Make mojo find the duckdb package from source without building a mojopkg.
# The source directory is named `duckdb/` so mojo resolves `from duckdb import ...` directly.
# MODULAR_MOJO_MAX_IMPORT_PATH overrides the default, so we include the stdlib path too.
# The stdlib path is listed first: mojo takes the first import-path entry that yields
# `std`, so leading with $CONDA_PREFIX/lib/mojo guarantees this env's own stdlib wins.
# (Listing the project root first lets mojo's recursive scan pick up a foreign
# std.mojoc from another env under .pixi/, e.g. the `full` env's older compiler,
# which then fails to load. See the operator-replacement block below.)
[activation.env]
MODULAR_MOJO_MAX_IMPORT_PATH = "$CONDA_PREFIX/lib/mojo,$PIXI_PROJECT_ROOT"

# Feature: operator-replacement (requires building DuckDB from source)
[feature.operator-replacement.dependencies]
duckdb-from-source = { path = "packages/duckdb-from-source" }
duckdb-operator-replacement = { path = "packages/operator-replacement" }
mojo = "=1.0.0b2.dev2026061203"

# The `full` environment sets no-default-feature = true, so the top-level
# [activation.env] above does not apply. Re-declare the import path here so
# `mojo` finds both the `duckdb` package (project root) and the installed
# packages — stdlib + operator_replacement — under $CONDA_PREFIX/lib/mojo.
# Stdlib path first (see note above): keeps each env's own std.mojoc from being
# shadowed by the other env's copy when both are materialized under .pixi/.
[feature.operator-replacement.activation.env]
MODULAR_MOJO_MAX_IMPORT_PATH = "$CONDA_PREFIX/lib/mojo,$PIXI_PROJECT_ROOT"

# Environments
# 
# default: Standard development environment using precompiled libduckdb from conda-forge.
#          Fast to set up, suitable for most development tasks.
#
# full:    Extended environment with operator-replacement feature enabled.
#          Uses source-built DuckDB (duckdb-from-source) which provides internal APIs needed
#          for operator replacement. This environment takes longer to build initially
#          but subsequent builds are cached.
#          solve-group = "full" isolates this environment from 'default' to prevent conflicts
#          between conda-forge's libduckdb and duckdb-from-source.
#          no-default-feature = true prevents including default dependencies, ensuring only
#          duckdb-from-source is used (avoiding binary incompatibility issues).
[environments]
full = { features = ["operator-replacement"], solve-group = "full", no-default-feature = true }

[target.linux-64.dependencies]
c-compiler = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
