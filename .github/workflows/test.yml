name: Run tests

on:
  push:
  workflow_dispatch:

jobs:
  check-generated-api:
    # Verify duckdb/_libduckdb.mojo was regenerated after any DuckDB version bump.
    # The bindings are platform-independent, so this only needs to run once.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # check-generated-api regenerates the bindings from the DuckDB source,
          # which lives in the third_party/duckdb submodule (pinned, shallow).
          submodules: recursive

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.84.1
          cache: true
          environments: default

      - name: Check generated bindings are up to date
        run: |
          source $HOME/.bash_profile
          pixi run check-generated-api

  build:
    strategy:
      matrix:
        include:
          - { target: linux-64, os: ubuntu-24.04 }
          # TODO: re-enable once the aarch64 Int128 by-value ABI issue is fixed
          # (4 test_appender hugeint/uhugeint failures with garbage register/stack contents).
          # - { target: linux-aarch64, os: ubuntu-22.04-arm }
          - { target: osx-arm64, os: macos-15 }
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add swap space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.84.1
          cache: true
          environments: default

      # The Mojo cache holds machine code compiled for the host CPU, and runners
      # of the same OS have different CPUs (some without AVX-512). Key the cache
      # on the CPU features so code is never restored onto a CPU that can't run it.
      - name: CPU features key
        id: cpu
        run: |
          if [ -r /proc/cpuinfo ]; then
            flags=$(grep -m1 '^flags' /proc/cpuinfo)
          else
            flags=$(sysctl -n machdep.cpu.brand_string)
          fi
          echo "key=$(echo "$flags" | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache Mojo compilation artifacts
        uses: actions/cache@v4
        with:
          path: .pixi/envs/default/share/max/cache
          # Bump the version suffix below to invalidate stale caches that
          # outlived a Mojo compiler upgrade (older caches can crash the
          # new compiler when restored).
          key: mojo-cache-v3-${{ matrix.target }}-${{ steps.cpu.outputs.key }}-${{ hashFiles('pixi.lock') }}
          restore-keys: |
            mojo-cache-v3-${{ matrix.target }}-${{ steps.cpu.outputs.key }}-

      - name: Run test suite
        run: |
          source $HOME/.bash_profile
          pixi run test

      - name: Run example (smoke test, needs network)
        if: always()
        run: |
          source $HOME/.bash_profile
          pixi run mojo run examples/example.mojo

      - name: Compile-check benchmarks and examples to guard against API/stdlib drift
        if: always()
        run: |
          source $HOME/.bash_profile
          pixi run compile-check

  # Verify the rattler-build recipe still builds and its in-package smoke test
  # passes. Builds recipe.local.yaml (which uses the working tree as source) so
  # it tests this commit. recipe.yaml pins a fixed SHA and is only used for the
  # actual modular-community publish. Keep the mojo-compiler pin in the recipe in sync
  # with pixi.toml or this job will fail to resolve.
  conda-recipe:
    strategy:
      matrix:
        include:
          - { target: linux-64, os: ubuntu-24.04 }
          - { target: osx-arm64, os: macos-15 }
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # emberserde 0.2.0 is not on modular-community (it has 0.1.0) until it is
      # published there. Build it from the pinned git commit (the commit behind
      # the 0.2.0 tag, matching pixi.lock) and hand the result to rattler-build
      # as a local channel.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.84.1
          cache: false
          run-install: false

      - name: Build emberserde from git
        run: |
          source $HOME/.bash_profile
          git clone --depth 1 --no-checkout --branch 0.2.0 \
            https://github.com/bgreni/EmberSerde.git "$RUNNER_TEMP/emberserde"
          git -C "$RUNNER_TEMP/emberserde" checkout \
            7fe1cb953d4585ed8cd0462fd7a7147c664a4791
          (cd "$RUNNER_TEMP/emberserde" && pixi build -o "$RUNNER_TEMP/emberserde-channel")

      # pixi build writes a flat directory. rattler-build only takes channels
      # with a repodata, so index the directory first (rattler-index fs).
      - name: Index emberserde channel
        run: |
          source $HOME/.bash_profile
          pixi exec -s rattler-index -- rattler-index fs "$RUNNER_TEMP/emberserde-channel"

      - name: Build and test conda recipe
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          recipe-path: conda.recipe/recipe.local.yaml
          # v0.65.0 (the action default) panics on local file:// channels
          # (rattler_conda_types channel parsing). 0.80.0 resolves them.
          rattler-build-version: v0.80.0
          # Channels rattler-build resolves dependencies from (mojo-compiler,
          # libduckdb and, until it is published, emberserde from the local
          # channel above).
          build-args: >-
            -c ${{ runner.temp }}/emberserde-channel
            -c conda-forge
            -c https://conda.modular.com/max
            -c https://repo.prefix.dev/modular-community
          upload-artifact: false
