package:
  name: duckdb-from-source
  version: 1.5.4

source:
  # Build from the in-repo DuckDB source submodule (third_party/duckdb), pinned
  # to the release tag in .gitmodules — the single source of truth shared with
  # code generation and the benchmark_runner. Initialize it first with
  # `git submodule update --init third_party/duckdb` (or `pixi run clone-duckdb`).
  # use_gitignore honors the submodule's .gitignore so a local build/ dir from a
  # prior benchmark_runner build isn't copied into the package source.
  - path: ../third_party/duckdb
    target_directory: duckdb-src
    use_gitignore: true

build:
  number: 0
  script: |
    set -ex
    
    # Build DuckDB from source
    cd $SRC_DIR/duckdb-src
    mkdir -p build/release
    cd build/release
    
    cmake $CMAKE_ARGS \
      -GNinja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=$PREFIX \
      ../..
    
    ninja
    
    # Install DuckDB library and headers
    mkdir -p $PREFIX/lib
    mkdir -p $PREFIX/include
    
    # Copy library
    cp src/libduckdb.* $PREFIX/lib/
    
    # Copy all headers (needed for operator replacement)
    cd $SRC_DIR/duckdb-src
    cp -r src/include/* $PREFIX/include/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - git

  host: []

  run: []
